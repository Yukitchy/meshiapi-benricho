<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px}

.frame{position:absolute;inset:22px;border:1px solid #c9a84c}

.sigil{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);color:#c9a84c;opacity:.35}

.eb{display:flex;align-items:center;gap:22px;font:700 22px/1 Inter,sans-serif;letter-spacing:.5em;color:#9a948a;margin-bottom:30px}
.eb::before,.eb::after{content:"";width:90px;height:1px;background:#c9a84c}
h1{margin:0;font-weight:900;font-size:128px;line-height:1.4;letter-spacing:.04em;white-space:nowrap}
rt{font-size:26px;font-weight:700;color:#9a948a;letter-spacing:.04em}
ruby{ruby-align:center}
.seal{display:inline-block;vertical-align:top;margin:14px 0 0 12px;width:50px;height:50px;border:3px solid #c4182f;font:900 30px/44px "Noto Sans JP";text-align:center;transform:rotate(4deg);letter-spacing:0}
